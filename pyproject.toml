[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-sports-reservation"
version = "0.1.0"
description = "SJTU sports venue reservation and request-analysis tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.50",
    "pycryptodome>=3.20",
    "python-dotenv>=1.0",
    "qq-botpy>=1.1.5",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
